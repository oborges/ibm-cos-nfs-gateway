server:
  nfs_port: 2049
  nfs_version: "4"
  metrics_enabled: true
  metrics_port: 8080
  health_enabled: true
  health_port: 8081
  debug_enabled: true
  debug_port: 8082
  max_connections: 1000
  read_timeout: "30s"
  write_timeout: "30s"
cos:
  endpoint: "https://s3.br-sao.cloud-object-storage.appdomain.cloud"
  bucket: "backupvideofiles"
  region: "br-sao"
  auth_type: "iam"
  api_key: ""
  service_id: "ServiceId-6b000082-c86c-42c9-a90d-589857a593e4"
  max_retries: 3
  timeout: "5m"
cache:
  metadata:
    enabled: true
    size_mb: 256
    ttl_seconds: 60
    max_entries: 10000
  data:
    enabled: true
    size_gb: 10
    path: "/var/cache/nfs-gateway"
    chunk_size_kb: 1024
performance:
  read_ahead_kb: 8192
  write_buffer_kb: 4096
  multipart_threshold_mb: 100
  multipart_chunk_mb: 10
  worker_pool_size: 100
  max_concurrent_reads: 50
  max_concurrent_writes: 25
  max_full_object_read_mb: 512
  max_buffered_write_mb: 512
  max_directory_entries: 100000
object_refresh:
  enabled: false
  interval: "5m"
  prefix: ""
logging:
  level: "info"
  format: "json"
  output: "stdout"
staging:
  enabled: true
  root_dir: "/var/staging/nfs-gateway-vdb"
  sync_interval: "2s"
  sync_threshold_mb: 1
  max_dirty_age: "5s"
  sync_on_close: false
  max_staging_size_gb: 1
  max_dirty_files: 10000
  sync_worker_count: 4
  sync_queue_size: 1000
  max_sync_retries: 3
  retry_backoff_initial: "1s"
  retry_backoff_max: "30s"
  clean_after_sync: true
  stale_file_age: "24h"
  backpressure_enabled: true
  backpressure_mode: "fail_fast"
  backpressure_high_watermark_percent: 1
  backpressure_critical_watermark_percent: 2
  backpressure_wait_timeout: "3s"
  backpressure_check_interval: "250ms"
