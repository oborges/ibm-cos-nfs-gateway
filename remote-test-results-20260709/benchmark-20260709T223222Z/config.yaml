# IBM Cloud COS NFS Gateway Configuration
# Local runtime config. Keep real credentials out of this file; prefer
# NFS_GATEWAY_COS_API_KEY or your deployment secret manager.

server:
  nfs_port: 2049
  nfs_version: "4"
  metrics_port: 8080
  health_port: 8081
  max_connections: 1000
  read_timeout: "30s"
  write_timeout: "30s"

cos:
  # IBM Cloud COS endpoint for us-south region
  endpoint: "s3.us-south.cloud-object-storage.appdomain.cloud"
  
  # Target bucket name
  bucket: "my-nfs-bucket"
  
  # Region
  region: "us-south"
  
  # Authentication type: "iam" or "hmac"
  auth_type: "iam"
  
  # IAM authentication
  api_key: ""
  service_id: ""
  
  # Connection settings
  max_retries: 3
  timeout: "30s"

cache:
  metadata:
    enabled: true
    size_mb: 256          # Memory cache size for metadata
    ttl_seconds: 60       # Time-to-live for cached metadata
    max_entries: 10000    # Maximum number of cached entries
  
  data:
    enabled: true
    size_gb: 10           # Disk cache size for file data
    path: "/var/cache/nfs-gateway"
    chunk_size_kb: 1024   # Size of cache chunks

performance:
  read_ahead_kb: 1024           # Read-ahead buffer size
  write_buffer_kb: 4096         # Write buffer size
  multipart_threshold_mb: 100   # Files larger than this use multipart upload
  multipart_chunk_mb: 10        # Size of each multipart chunk
  worker_pool_size: 100         # Number of worker goroutines
  max_concurrent_reads: 50      # Maximum concurrent read operations
  max_concurrent_writes: 25     # Maximum concurrent write operations

logging:
  level: "info"     # debug, info, warn, error
  format: "json"    # json or text
  output: "stdout"  # stdout, stderr, or file path

# Staging layer configuration (MVP - disabled by default)
staging:
  # Feature flag - set to true to enable staging-based write path
  enabled: false
  
  # Staging directory
  root_dir: "/var/staging/nfs-gateway"
  
  # Sync triggers
  sync_interval: "30s"           # Check for dirty files every 30s
  sync_threshold_mb: 10          # Sync files when they reach 10MB
  max_dirty_age: "5m"            # Sync files dirty for >5 minutes
  sync_on_close: false           # Don't sync immediately on close (async)
  
  # Resource limits
  max_staging_size_gb: 10        # Max staging directory size
  max_dirty_files: 1000          # Max number of dirty files
  
  # Sync worker configuration
  sync_worker_count: 4           # Number of background sync workers
  sync_queue_size: 100           # Max sync queue depth
  
  # Retry policy
  max_sync_retries: 3            # Max retry attempts per file
  retry_backoff_initial: "1s"    # Initial retry backoff
  retry_backoff_max: "60s"       # Max retry backoff
  
  # Cleanup policy
  clean_after_sync: true         # Remove staging file after successful sync
  stale_file_age: "24h"          # Remove stale files older than 24h

